[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "audit-llm-raters"
version = "0.1.0"
description = "Measurement audit of LLM essay scoring with generalizability theory and many-facet Rasch models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
bayes = ["jax>=0.4.30", "numpyro>=0.15"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
audit-raters = "audit_llm_raters.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/audit_llm_raters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
