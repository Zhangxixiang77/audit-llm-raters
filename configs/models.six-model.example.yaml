# Six-family pilot candidate, checked 2026-11-07. No credentials are stored here.
# Execute one currency at a time. The Hugging Face model also requires a separate
# external-GPU/runtime budget and a pinned full source revision before execution.
models:
  - name: minimax_m3
    provider: openai_compatible
    model_version: MiniMax-M3
    base_url: https://api.minimax.cn/v1
    api_key_env: MINIMAX_API_KEY
    temperature: null  # MiniMax-M3 fixes temperature=1.
    max_output_tokens: 200
    max_retries: 5
    json_mode: true
    extra_body: {thinking: {type: disabled}}
    pricing: {input_per_million: 2.10, output_per_million: 8.40}
    currency: CNY

  - name: openai_gpt_6_1_terra
    provider: openai_compatible
    model_version: gpt-6.1-terra
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    temperature: null
    max_output_tokens: 200
    max_tokens_field: max_completion_tokens
    max_retries: 5
    json_mode: true
    extra_body: {reasoning_effort: none}
    pricing: {input_per_million: 1.00, output_per_million: 5.00}
    currency: USD

  - name: anthropic_claude_haiku_4_5
    provider: anthropic
    model_version: claude-haiku-4-5-20251001
    api_key_env: ANTHROPIC_API_KEY
    anthropic_version: 2026-10-21
    temperature: 0
    max_output_tokens: 200
    max_retries: 5
    extra_body: {thinking: {type: disabled}}
    pricing: {input_per_million: 1.00, output_per_million: 5.00}
    currency: USD

  - name: deepseek_v4_1_flash
    provider: openai_compatible
    # Provider alias documented as DeepSeek-V4.1-Flash-1017 on 2026-11-07.
    model_version: deepseek-flash
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    temperature: 0
    max_output_tokens: 200
    max_retries: 5
    json_mode: true
    extra_body: {thinking: {type: disabled}}
    # Conservative peak, cache-miss prices; off-peak/cache hits may cost less.
    pricing: {input_per_million: 0.30, output_per_million: 1.20}
    currency: USD

  - name: qwen_3_6_plus
    provider: openai_compatible
    model_version: qwen3.6-plus-2026-04-02
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    temperature: 0
    max_output_tokens: 200
    max_retries: 5
    json_mode: true
    extra_body: {enable_thinking: false}
    # Beijing/global list prices for prompts <=256K; verify account region before execution.
    pricing: {input_per_million: 2.00, output_per_million: 12.00}
    currency: CNY

  - name: hf_llama_3_1_8b_instruct
    provider: openai_compatible
    model_version: meta-llama/Llama-3.1-8B-Instruct
    source_revision: REPLACE_WITH_FULL_HF_COMMIT
    base_url: http://localhost:8000/v1  # Remote vLLM URL may be supplied locally.
    # api_key_env: VLLM_API_KEY  # Optional; never put the key in this file.
    temperature: 0
    max_output_tokens: 200
    max_retries: 5
    json_mode: true
    # Self-hosted compute is budgeted by GPU hours, not fabricated token prices.
